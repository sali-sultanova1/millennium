name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create environment file
        run: cp .env.example .env

      - name: Build Docker image
        run: docker compose build web

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Check Django configuration
        run: docker compose run --rm web python manage.py check

      - name: Check development configuration
        run: docker compose run --rm -e DEBUG=True web python manage.py check

      - name: Check migrations
        run: docker compose run --rm web python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: docker compose run --rm web python manage.py test -v 2

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Stop services
        if: always()
        run: docker compose down -v