<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Millennium{% endblock %}</title>
</head>
<body>
    <header>
        <a href="{% url 'catalog:tour_list' %}">Millennium</a>

        <nav aria-label="Основная навигация">
            <a href="{% url 'catalog:tour_list' %}">Туры</a>
            <a href="{% url 'inquiries:create' %}">Подобрать мне тур</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© {% now "Y" %} Millennium — туристическое агентство</p>
    </footer>
</body>
</html>
