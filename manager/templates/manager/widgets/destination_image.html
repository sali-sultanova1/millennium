<div class="direction-photo-editor">
    {% if widget.is_initial %}
        <img class="direction-cover" src="{{ widget.value.url }}" alt="Текущая обложка">
    {% endif %}
    {% include "django/forms/widgets/file.html" %}
    {% if widget.is_initial and not widget.required %}
        <label class="direction-photo-remove" for="{{ widget.checkbox_id }}">
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
            Убрать фото при сохранении
        </label>
    {% endif %}
</div>
