{% extends "base.html" %}
{% block title %}Избранное — Миллениум{% endblock %}
{% block content %}
<header class="page-banner"><div class="wrap">
    <nav class="crumbs" aria-label="Хлебные крошки"><a href="{% url 'home' %}">Главная</a><span aria-current="page">Избранное</span></nav>
    <h1>Ваше избранное</h1><p>Отметьте туры, которые хотите обсудить с менеджером. Вы сможете отправить их одной заявкой.</p>
</div></header>
<div class="wrap page">
    <form id="favorites-selection" class="saved-layout" method="get" action="{% url 'inquiries:favorites_create' %}">
        <div class="saved-items">
        <div class="selection-tools" id="favorites-tools" hidden>
            <h2>Сохранённые туры</h2>
            <div class="minor-actions"><button type="button" id="select-all-favorites">Выбрать все</button><button type="button" id="clear-favorites-selection">Снять выбор</button></div>
        </div>
        <div id="favorites-list" class="favorites-list" data-items-url="{% url 'catalog:favorites_items' %}" aria-live="polite"></div>
        <noscript><p>Для хранения избранного в этом браузере нужен JavaScript. Заявку также можно оставить со страницы тура.</p></noscript>
        </div>
        <aside id="favorites-submit" class="selection-footer" hidden>
            <h2>Ваша подборка</h2>
            <output id="favorites-count" aria-live="polite">Выбрано 0</output>
            <button class="btn primary" type="submit">Обсудить выбранные туры</button>
            <p id="favorites-selection-error" class="error-message" role="status"></p>
        </aside>
        <template id="favorites-empty">
            <section class="empty">
                <span class="empty-mark" aria-hidden="true"><span class="icon i-heart"></span></span>
                <h2>Здесь будут ваши туры</h2>
                <p>Нажмите на сердечко у тура в каталоге. Сохранённые варианты появятся здесь на этом устройстве.</p>
                <a href="{% url 'catalog:tour_list' %}" class="btn secondary">Открыть каталог</a>
            </section>
        </template>
    </form>
</div>
{% endblock %}
